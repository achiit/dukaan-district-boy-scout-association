<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>District Boy Scout Association Khairpur Mir's</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚜️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#0d1210;--card:#17201c;--bd:rgba(251,191,36,.26);--tx:#f5f7f4;--mu:#b4c4bc;--g1:#064e3b;--g2:#047857;--au:#d97706;--au2:#fbbf24;--er:#f87171;--ok:#34d399;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#f4f7f5;--card:#fff;--bd:#d5e0da;--tx:#0f1f19;--mu:#52665d;--er:#b91c1c;--ok:#047857;color-scheme:light}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(900px 420px at 85% -5%,rgba(217,119,6,.16),transparent),radial-gradient(800px 520px at -5% 25%,rgba(4,120,87,.2),transparent),var(--bg);background-attachment:fixed;color:var(--tx);font:15px/1.55 Inter,system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:Inter,system-ui,sans-serif;font-weight:700;letter-spacing:-.01em;margin:0 0 .4em;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
.hdr{position:sticky;top:0;z-index:20;background:rgba(6,78,59,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;border-bottom:3px solid var(--au2);display:flex;align-items:center;gap:12px;padding:10px 16px}
.hdr .t{flex:1;min-width:0}.hdr .t b{font-size:15px;font-weight:700;display:block;line-height:1.2;white-space:normal}.hdr .t small{color:var(--au2)}
.ib{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
nav{display:flex;gap:4px}
nav button{background:none;border:0;color:#d1fae5;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
nav button.on{background:var(--au);color:#fff}
@media(max-width:720px){.hdr nav{position:fixed;left:0;right:0;bottom:0;background:var(--g1);border-top:3px solid var(--au2);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30;justify-content:space-around}nav button{padding:8px 6px;font-size:12px;flex:1}main{padding-bottom:90px!important}.hdr .t small{display:none}}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 8px 28px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.04),0 0 18px rgba(251,191,36,.07)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.btn{border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:700;background:linear-gradient(180deg,#e8890f,#d97706);color:#fff;box-shadow:0 4px 12px rgba(217,119,6,.35)}
.btn.au{background:linear-gradient(180deg,#e8890f,#d97706)}.btn.er{background:rgba(248,113,113,.12);border:1.5px solid var(--er);color:var(--er);box-shadow:none}.btn.gh{background:none;border:1px solid var(--bd);color:var(--tx);box-shadow:none}.btn.sm{padding:5px 10px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav button:focus-visible{outline:3px solid var(--au2);outline-offset:2px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px;font-weight:600}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px 11px}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--au2);color:#3b2400}
.pill.ok{background:#d1fae5;color:#064e3b}.pill.no{background:#fee2e2;color:#7f1d1d}
.hero{position:relative;border-radius:18px;overflow:hidden;min-height:260px;color:#fff;border:1px solid rgba(251,191,36,.5);margin-bottom:16px;box-shadow:0 18px 40px rgba(0,0,0,.45),0 0 30px rgba(217,119,6,.2)}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .5s}
.hero .ov{position:relative;padding:28px 22px;min-height:260px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(0deg,rgba(0,0,0,.78),rgba(0,0,0,.05))}
.hero h2{font-size:clamp(22px,5vw,34px);font-weight:800}.hero p{margin:0;max-width:60ch}
.dots{position:absolute;top:12px;right:14px;display:flex;gap:6px}.dots i{width:9px;height:9px;border-radius:50%;background:#fff6;cursor:pointer}.dots i.on{background:var(--au2)}
.hero .arr{position:absolute;top:50%;transform:translateY(-50%);background:#0006;border:0;color:#fff;font-size:22px;width:36px;height:44px;cursor:pointer;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ph{border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--card);cursor:pointer}
.ph img{width:100%;height:150px;object-fit:cover;display:block}.ph div{padding:8px 10px;font-size:13px}.ph small{color:var(--mu)}
.modal{position:fixed;inset:0;background:#000b;z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px}
.mb{background:var(--card);border:1px solid var(--bd);border-radius:14px;max-width:620px;width:100%;padding:18px}
.login{min-height:100vh;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at 20% 10%,#047857 0,#064e3b 55%,#03281e)}
.login .card{max-width:400px;width:100%;border-top:4px solid var(--au2)}
.btn{transition:transform .12s,filter .12s}.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.97)}.ph{transition:transform .15s,box-shadow .15s}.ph:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.22)}.mb{animation:pop .18s ease-out}@keyframes pop{from{transform:scale(.96);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.btn svg{vertical-align:-2px;margin-right:5px}main{padding-bottom:110px!important}
.hero .bg{transition:transform .8s ease-out;animation:kb .7s ease-out}.hero:hover .bg{transform:scale(1.04)}.hero .ov h2,.hero .ov p{animation:rise .5s ease-out}.hero .arr{transition:background .15s,transform .15s}.hero .arr:hover{background:var(--au)}.hero .arr:active{transform:translateY(-50%) scale(.92)}@keyframes kb{from{opacity:.25;transform:scale(1.07)}}@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;justify-content:space-around;align-items:flex-end;gap:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:rgba(8,28,22,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid rgba(251,191,36,.45);box-shadow:0 -8px 24px rgba(0,0,0,.35)}
.bnav .ni{flex:1;max-width:96px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:#a7c4b8;font-size:11px;font-weight:600;padding:6px 2px;border-radius:10px;cursor:pointer;transition:color .15s,transform .15s}.bnav .ni:hover{color:#fff;transform:translateY(-2px)}.bnav .ni.on{color:var(--au2);background:none}
.bnav .ic{position:relative;display:grid}.bnav .bg{position:absolute;top:-6px;right:-10px;min-width:15px;height:15px;padding:0 3px;border-radius:9px;background:var(--au);color:#fff;font:700 10px/15px Inter,sans-serif;font-style:normal;text-align:center;border:1.5px solid #081c16;box-sizing:content-box}
.bnav .plus{flex:none;width:54px;height:54px;border-radius:18px;margin:-24px 6px 4px;border:0;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;font-size:32px;font-weight:300;line-height:1;cursor:pointer;box-shadow:0 8px 20px rgba(217,119,6,.55),0 0 0 4px rgba(8,28,22,.92);transition:transform .15s}.bnav .plus:hover{transform:translateY(-3px) rotate(90deg)}.bnav .plus:active{transform:scale(.93)}
.err{color:var(--er);font-size:13px;min-height:18px;margin-top:8px}
footer{text-align:center;color:var(--mu);font-size:13px;padding:20px 12px 8px}
.idc{width:340px;max-width:100%;margin:auto;border:2px solid var(--g1);border-radius:14px;overflow:hidden;background:#fff;color:#0f1f19}
.idc .h{background:var(--g1);color:#fff;padding:10px;display:flex;gap:10px;align-items:center;border-bottom:4px solid var(--au2)}
.idc .h b{font-size:13px;line-height:1.15}.idc .b{padding:12px;display:flex;gap:12px;font-size:13px}
.idc .pic{width:84px;height:100px;border:1px solid #ccc;object-fit:cover;background:#e7efe9;border-radius:6px}
.sheet{background:#fff;color:#111;padding:26px;border:1px solid #ccc;font:14px/1.6 Georgia,serif}
.sheet .lh{display:flex;gap:14px;align-items:center;border-bottom:3px double #064e3b;padding-bottom:10px;margin-bottom:16px}
.sheet .lh b{font-size:17px;color:#064e3b;display:block}
@media print{body *{visibility:hidden}.sheet,.sheet *,.idc,.idc *{visibility:visible}.sheet,.idc{position:absolute;left:0;top:0;width:100%;border:0}}
</style>
</head>

function logo(sz=40){return `<img src="${S.logo||DEF_LOGO}" width="${sz}" height="${sz}" alt="District Boy Scout Association Khairpur official logo" style="object-fit:contain;border-radius:50%;flex:none">`}
function toast(m){const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#064e3b;color:#fff;border:1px solid #fbbf24;padding:10px 16px;border-radius:10px;z-index:99';document.body.append(d);setTimeout(()=>d.remove(),2200)}
function modal(h){closeM();const m=document.createElement('div');m.className='modal';m.id='mod';m.innerHTML=`<div class="mb" role="dialog" aria-modal="true">${h}</div>`;m.onclick=e=>{if(e.target===m)closeM()};document.body.append(m)}
const closeM=()=>$('#mod')?.remove();
function img2data(file,max=900){return new Promise(r=>{if(!file)return r('');const f=new FileReader();f.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};i.onerror=()=>r('');i.src=f.result};f.readAsDataURL(file)})}
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('dbsa_theme',t)}
function toggleTheme(){const d=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);setTheme(d?'light':'dark')}

const TR='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v6M14 10v6"/></svg>';
function quickAdd(){const a=ME.role==='secretary',go=(t,id)=>{closeM();TAB=t;shell();$(id)?.click()};
 modal(`<h3>Quick actions</h3><div class="row"><button class="btn" id="q1">Upload photo</button>${a?'<button class="btn" id="q3">Post notice</button><button class="btn" id="q4">Add camp</button><button class="btn" id="q5">Edit slider</button>':'<button class="btn" id="q2">New application</button>'}</div>`);
 $('#q1').onclick=()=>go('gal','#up');if(a){$('#q3').onclick=()=>go('dash','#na');$('#q4').onclick=()=>go('camps','#ac');$('#q5').onclick=()=>{closeM();sliderEditor()}}else $('#q2').onclick=()=>go('req','#nw')}
/* ---------- AUTH ---------- */
function loginView(mode='in'){
 clearInterval(timer);
 $('#app').innerHTML=`<div class="login"><div class="card"><div class="row" style="margin-bottom:10px">${logo(56)}<div><h2 style="margin:0">District Boy Scout Association</h2><small style="color:var(--mu)">Khairpur Mir's, Sindh</small></div></div>
 ${mode==='in'?`<form id="lf"><label for="un">Username</label><input id="un" autocomplete="username" required><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required><div class="err" id="er" role="alert"></div><button class="btn" style="width:100%;margin-top:6px">Sign in</button></form><p class="row" style="justify-content:space-between;margin:14px 0 0"><button class="btn gh sm" id="reg">Register as Scout Member</button><button class="btn gh sm" id="th">Light / dark</button></p>`
 :`<form id="rf"><h3>Scout registration</h3><label>Full name</label><input name="fullName" required><label>Username</label><input name="username" required minlength="3"><label>Password (min 8 characters)</label><input name="pw" type="password" required minlength="8"><label>Troop / group</label><input name="group" required><label>CNIC / B-Form no.</label><input name="cnic" required><label>Phone</label><input name="phone" type="tel" required><label>Emergency contact name</label><input name="emName" required><label>Emergency contact phone</label><input name="emPhone" type="tel" required><label>Passport-size photo</label><input name="photo" type="file" accept="image/*" required><label>Identity document (CNIC / B-Form scan)</label><input name="idDoc" type="file" accept="image/*" required><div class="err" id="er" role="alert"></div><div class="row"><button class="btn">Submit for approval</button><button type="button" class="btn gh" id="bk">Back</button></div></form>`}
 </div></div>`;
 if(mode==='in'){$('#th').onclick=toggleTheme;$('#reg').onclick=()=>loginView('reg');
  $('#lf').onsubmit=async e=>{e.preventDefault();const u=S.users.find(x=>x.username===$('#un').value.trim().toLowerCase());const h=await hash($('#pw').value);
   if(!u||u.pw!==h)return $('#er').textContent='Incorrect username or password.';
   if(u.status==='pending')return $('#er').textContent='Your registration is awaiting approval by the District Secretary.';
   if(u.status==='rejected')return $('#er').textContent='This registration was declined by the District Secretary.'+(u.reason?' Reason: '+u.reason:'');
   sessionStorage.setItem('dbsa_sess',u.id);ME=u;TAB='dash';shell()}}
 else{$('#bk').onclick=()=>loginView();$('#rf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),un=f.get('username').trim().toLowerCase();
   if(S.users.some(x=>x.username===un))return $('#er').textContent='That username is taken.';
   const id='u'+Date.now();S.users.push({id,username:un,pw:await hash(f.get('pw')),fullName:f.get('fullName').trim(),role:'member',group:f.get('group'),cnic:f.get('cnic'),phone:f.get('phone'),photo:await img2data(f.get('photo'),500),idDoc:await img2data(f.get('idDoc'),1000),emName:f.get('emName'),emPhone:f.get('emPhone'),status:'pending'});
   S.requests.push({id:'r'+Date.now(),kind:'registration',userId:id,title:'New scout registration',body:'',status:'pending',date:new Date().toISOString().slice(0,10)});save();loginView();$('#er').style.color='var(--ok)';$('#er').textContent='Submitted. You can sign in once the District Secretary approves.'}}
}
function logout(){sessionStorage.removeItem('dbsa_sess');ME=null;loginView()}

/* ---------- SHELL ---------- */
function shell(){
 const IC={dash:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',camps:'<path d="M3 20L12 4l9 16zM12 4v16M8 20l4-7 4 7"/>',gal:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',req:'<path d="M9 3h6l1 2h3v16H5V5h3zM9 12l2 2 4-4"/>'};
 const bd={camps:S.camps.filter(c=>c.status==='Open').length,req:ME.role==='secretary'?S.requests.filter(r=>r.status==='pending').length:S.requests.filter(r=>r.userId===ME.id&&r.status==='pending').length};
 const ti=(k,l)=>`<button class="ni ${TAB===k?'on':''}" data-t="${k}" aria-label="${l}"><span class="ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>${bd[k]?`<i class="bg">${bd[k]}</i>`:''}</span>${l}</button>`;
 const navHtml=`<nav class="bnav" aria-label="Main">${ti('dash','Dashboard')}${ti('camps','Camps')}<button class="plus" id="qa" aria-label="Quick actions">+</button>${ti('gal','Gallery')}${ti('req','Requests')}</nav>`;
 const pend=S.requests.filter(r=>r.status==='pending').length;
 $('#app').innerHTML=`<header class="hdr">${logo(52)}<div class="t"><b>District Boy Scout Association Khairpur Mir's</b><small>Sindh, Pakistan</small></div>
 
 <button class="ib" id="th" aria-label="Toggle dark mode">◐</button><button class="ib" id="um" aria-label="Open menu" aria-haspopup="dialog" style="font-size:20px;line-height:1;padding:6px 12px">⋮</button></header>
 <main id="main"></main>${navHtml}<footer>© District Boy Scout Association Khairpur Mir's, Sindh<br>Designed &amp; Developed by Ali Ayaz Mangi</footer>`;
 document.querySelectorAll('.ni').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;shell();scrollTo(0,0)});$('#qa').onclick=quickAdd;
 $('#th').onclick=toggleTheme;$('#um').onclick=userMenu;
 ({dash,camps,gal,req})[TAB]();
}
function userMenu(){modal(`<h3>${esc(ME.fullName)}</h3><p>${ROLES[ME.role]} · ${esc(ME.group)}</p><div class="row"><button class="btn" id="idb">Scout ID card</button>${ME.role==='secretary'?'<button class="btn au" id="ss">Dashboard Event Slider Admin</button><button class="btn au" id="lg">Replace logo</button>':''}<button class="btn gh" id="so">Sign out</button></div>`);
 $('#so').onclick=()=>{closeM();logout()};$('#idb').onclick=()=>idCard(ME);if($('#ss'))$('#ss').onclick=()=>{closeM();sliderEditor()};
 if($('#lg'))$('#lg').onclick=()=>modal(`<h3>Official logo</h3><label>Upload the association logo (PNG/JPG)</label><input type="file" id="lf" accept="image/*"><div class="row" style="margin-top:12px"><button class="btn" id="ls">Save logo</button><button class="btn gh" id="lr">Use official default logo</button></div>`)||($('#ls').onclick=async()=>{const d=await img2data($('#lf').files[0],300);if(d){S.logo=d;save();closeM();shell()}},$('#lr').onclick=()=>{S.logo='';save();closeM();shell()})}

/* ---------- DASHBOARD ---------- */
function dash(){
 const adm=ME.role==='secretary',sl=S.slides;
 $('#main').innerHTML=`<section class="hero" id="hero" aria-label="Featured events"></section>
 ${adm?'<div class="row" style="margin:-6px 0 14px"><button class="btn au" id="se">Edit slider</button></div>':''}
 <div class="card"><div class="row"><h2 class="sp">Public announcements</h2>${adm?'<button class="btn sm" id="na">Post notice</button>':''}</div>
 ${S.notices.length?S.notices.map(n=>`<div style="border-top:1px solid var(--bd);padding:10px 0"><div class="row"><span class="pill">${esc(n.kind)}</span><small style="color:var(--mu)">${esc(n.date)}</small><span class="sp"></span>${adm?`<button class="btn er sm" data-dn="${n.id}">${TR}Delete</button>`:''}</div><b>${esc(n.title)}</b><div style="color:var(--mu)">${esc(n.body)}</div></div>`).join(''):'<p>No announcements yet.</p>'}</div>`;
 drawSlide();clearInterval(timer);timer=setInterval(()=>{if(S.slides.length>1){SI=(SI+1)%S.slides.length;drawSlide()}},6000);
 if(adm){$('#se').onclick=sliderEditor;$('#na').onclick=()=>modal(`<h3>Post notice</h3><form id="nf"><label>Type</label><select name="kind"><option>Notice</option><option>Event</option><option>Alert</option></select><label>Title</label><input name="title" required><label>Details</label><textarea name="body" rows="3" required></textarea><div class="row" style="margin-top:12px"><button class="btn">Publish</button></div></form>`)||($('#nf').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));S.notices.unshift({id:Date.now(),date:new Date().toISOString().slice(0,10),...f});save();closeM();dash()});
  document.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{S.notices=S.notices.filter(n=>n.id!=b.dataset.dn);save();dash()})}
}
function drawSlide(){const h=$('#hero');if(!h)return;const sl=S.slides;if(!sl.length){h.innerHTML='<div class="ov"><h2>No slides</h2></div>';h.style.background=GRADS[0];return}
 SI%=sl.length;const s=sl[SI];h.innerHTML=`<div class="bg" style="background:${s.img?`url(${s.img}) center/cover`:GRADS[s.g%3]}"></div><div class="ov"><span class="pill" style="align-self:flex-start;margin-bottom:8px">${esc(s.badge)}</span><h2>${esc(s.title)}</h2><p>${esc(s.desc)}</p></div>
 <button class="arr" style="left:8px" aria-label="Previous slide" id="pv">‹</button><button class="arr" style="right:8px" aria-label="Next slide" id="nx">›</button><div class="dots">${sl.map((_,i)=>`<i class="${i===SI?'on':''}" data-i="${i}"></i>`).join('')}</div>`;
 $('#pv').onclick=()=>{SI=(SI-1+sl.length)%sl.length;drawSlide()};$('#nx').onclick=()=>{SI=(SI+1)%sl.length;drawSlide()};h.querySelectorAll('.dots i').forEach(d=>d.onclick=()=>{SI=+d.dataset.i;drawSlide()})}
function sliderEditor(){
 const draft=JSON.parse(JSON.stringify(S.slides));
 const draw=()=>modal(`<h3>Slider editor</h3>${draft.map((s,i)=>`<div class="card" style="padding:12px"><div class="row"><b class="sp">Slide ${i+1}</b><button class="btn gh sm" data-m="${i},-1" ${i?'':'disabled'} aria-label="Move up">↑</button><button class="btn gh sm" data-m="${i},1" ${i<draft.length-1?'':'disabled'} aria-label="Move down">↓</button><button class="btn er sm" data-d="${i}">${TR}Delete</button></div>
 <label>Badge</label><input data-f="${i},badge" value="${esc(s.badge)}"><label>Title</label><input data-f="${i},title" value="${esc(s.title)}"><label>Description</label><textarea rows="2" data-f="${i},desc">${esc(s.desc)}</textarea><label>Image ${s.img?'(uploaded)':'(default artwork)'}</label><input type="file" accept="image/*" data-im="${i}"></div>`).join('')}
 <div class="row"><button class="btn gh" id="ad">Add slide</button><button class="btn gh" id="rs">Reset to defaults</button><span class="sp"></span><button class="btn" id="sv">Save slides</button></div>`);
 const bind=()=>{document.querySelectorAll('[data-f]').forEach(e=>e.oninput=()=>{const[i,k]=e.dataset.f.split(',');draft[i][k]=e.value});
  document.querySelectorAll('[data-im]').forEach(e=>e.onchange=async()=>{draft[e.dataset.im].img=await img2data(e.files[0],1100);draw();bind()});
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{draft.splice(+b.dataset.d,1);draw();bind()});
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const[i,d]=b.dataset.m.split(',').map(Number);[draft[i],draft[i+d]]=[draft[i+d],draft[i]];draw();bind()});
  $('#ad').onclick=()=>{draft.push({id:Date.now(),img:'',badge:'New',title:'New event',desc:'Add a description.',g:draft.length%3});draw();bind()};
  $('#rs').onclick=()=>{draft.splice(0,draft.length,...defSlides());draw();bind()};
  $('#sv').onclick=()=>{S.slides=draft;SI=0;save();closeM();TAB='dash';shell();toast('Slides saved')}};
 draw();bind()}

/* ---------- CAMPS ---------- */
function camps(){const adm=ME.role==='secretary';
 $('#main').innerHTML=`<div class="row"><h2 class="sp">Live camps</h2>${adm?'<button class="btn" id="ac">Add camp</button>':''}</div>${S.camps.map(c=>`<div class="card"><div class="row"><h3 class="sp" style="margin:0">${esc(c.name)}</h3><span class="pill ${c.status==='Open'?'ok':''}">${esc(c.status)}</span></div><p style="margin:6px 0;color:var(--mu)">${esc(c.dates)} · ${esc(c.place)}</p><div class="row"><button class="btn sm" data-ap="${c.id}">Apply to join</button>${adm?`<button class="btn er sm" data-dc="${c.id}">${TR}Remove</button>`:''}</div></div>`).join('')||'<p>No camps scheduled.</p>'}`;
 document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>{const c=S.camps.find(x=>x.id==b.dataset.ap);S.requests.push({id:'r'+Date.now(),kind:'application',userId:ME.id,title:'Camp application: '+c.name,body:`I, ${ME.fullName} of ${ME.group}, respectfully request permission to attend ${c.name} (${c.dates}) at ${c.place}.`,status:'pending',date:new Date().toISOString().slice(0,10)});save();toast('Application sent to the District Secretary')});
 document.querySelectorAll('[data-dc]').forEach(b=>b.onclick=()=>{S.camps=S.camps.filter(x=>x.id!=b.dataset.dc);save();camps()});
 if(adm)$('#ac').onclick=()=>{modal(`<h3>Add camp</h3><form id="cf"><label>Name</label><input name="name" required><label>Dates</label><input name="dates" required><label>Location</label><input name="place" required><label>Status</label><select name="status"><option>Open</option><option>Planned</option><option>Closed</option></select><div style="margin-top:12px"><button class="btn">Save camp</button></div></form>`);$('#cf').onsubmit=e=>{e.preventDefault();S.camps.push({id:Date.now(),...Object.fromEntries(new FormData(e.target))});save();closeM();camps()}}}

/* ---------- GALLERY ---------- */
function gal(){
 $('#main').innerHTML=`<div class="row"><h2 class="sp">Gallery</h2><button class="btn" id="up">Upload photo</button></div><div class="grid" style="margin-top:12px">${S.gallery.map(p=>`<div class="ph" tabindex="0" data-p="${p.id}"><img src="${p.img}" alt="${esc(p.caption)}"><div><b>${esc(p.caption)}</b><br><small>${esc(p.by)} · ${esc(p.role)}</small></div></div>`).join('')||'<p>No photos yet. Be the first to upload.</p>'}</div>`;
 document.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>{const p=S.gallery.find(x=>x.id==e.dataset.p);modal(`<img src="${p.img}" alt="${esc(p.caption)}" style="width:100%;border-radius:10px"><h3 style="margin-top:10px">${esc(p.caption)}</h3><p>Photo by <b>${esc(p.by)}</b> (${esc(p.role)}) · ${esc(p.date)}</p><div class="row">${ME.role==='secretary'||p.uid===ME.id?`<button class="btn er sm" id="dp">${TR}Delete photo</button>`:''}<button class="btn gh sm" onclick="closeM()">Close</button></div>`);if($('#dp'))$('#dp').onclick=()=>{S.gallery=S.gallery.filter(x=>x.id!==p.id);save();closeM();gal()}});
 $('#up').onclick=()=>{modal(`<h3>Upload photo</h3><p><span class="pill ok">Active session contributor</span> ${esc(ME.fullName)} · ${ROLES[ME.role]}</p><form id="uf"><label>Photo</label><input type="file" name="f" accept="image/*" required><label>Caption</label><input name="c" required><div style="margin-top:12px"><button class="btn">Upload</button></div></form>`);
  $('#uf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),d=await img2data(f.get('f'),900);if(!d)return;S.gallery.unshift({id:Date.now(),img:d,caption:f.get('c'),by:ME.fullName,role:ROLES[ME.role],uid:ME.id,date:new Date().toISOString().slice(0,10)});save();closeM();gal()}}}

/* ---------- REQUESTS ---------- */
function req(){ME.role==='secretary'?adminReq():userReq()}
function adminReq(){
 const P=S.requests.filter(r=>r.status==='pending'),D=S.requests.filter(r=>r.status!=='pending');
 const item=r=>{const u=gu(r.userId);return`<div class="card" style="padding:12px"><div class="row"><div class="sp"><b>${esc(r.title)}</b><br><small style="color:var(--mu)">${esc(u?.fullName)} · ${esc(u?.group)} · ${esc(r.date)}</small></div><span class="pill ${r.status==='approved'?'ok':r.status==='rejected'?'no':''}">${r.status}</span></div>${r.status==='pending'?`<div class="row" style="margin-top:10px"><button class="btn sm" data-a="${r.id}">Approve</button><button class="btn er sm" data-r="${r.id}">Reject</button><button class="btn gh sm" data-v="${r.id}">Review</button></div>`:''}</div>`};
 $('#main').innerHTML=`<h2>Pending approvals <span class="pill">${P.length}</span></h2><p style="color:var(--mu);margin-top:0">Private to the District Secretary. Never shown in public announcements.</p>${P.map(item).join('')||'<div class="card">No pending requests.</div>'}<h3>Decided</h3>${D.map(item).join('')||'<p>Nothing yet.</p>'}`;
 const dec=(id,s,why)=>{const r=S.requests.find(x=>x.id===id);r.status=s;r.reason=why||'';let msg='Rejected by the District Secretary';if(r.kind==='registration'){const u=gu(r.userId);u.status=s==='approved'?'active':'rejected';u.reason=why||'';if(s==='approved'){const n=S.users.filter(x=>x.memberNo).length+1;u.memberNo='DBSA-KHP-'+new Date().getFullYear()+'-'+String(n).padStart(4,'0');u.verified=true;msg='Approved by the District Secretary. Membership no. '+u.memberNo}}else if(s==='approved')msg='Approved by the District Secretary';save();closeM();shell();toast(msg)};
 const rej=id=>{modal(`<h3>Reject request</h3><label for="why">Reason (optional, shown to the applicant)</label><textarea id="why" rows="3"></textarea><div class="row" style="margin-top:12px"><button class="btn er" id="rc">Confirm rejection</button><button class="btn gh" onclick="closeM()">Cancel</button></div>`);$('#rc').onclick=()=>dec(id,'rejected',$('#why').value.trim())};
 document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>dec(b.dataset.a,'approved'));
 document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>rej(b.dataset.r));
 document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const r=S.requests.find(x=>x.id===b.dataset.v),u=gu(r.userId);
  modal(`<h3>${esc(r.title)}</h3><div class="row" style="align-items:flex-start">${u.photo?`<img src="${u.photo}" alt="Submitted document" style="width:140px;border-radius:8px;border:1px solid var(--bd)">`:''}<div class="sp"><p><b>Name:</b> ${esc(u.fullName)}<br><b>Username:</b> ${esc(u.username)}<br><b>Group:</b> ${esc(u.group)}<br><b>CNIC / B-Form:</b> ${esc(u.cnic||'—')}<br><b>Phone:</b> ${esc(u.phone||'—')}<br><b>Emergency contact:</b> ${esc(u.emName||'—')} ${esc(u.emPhone||'')}<br><b>Verification:</b> ${u.idDoc?'Identity document uploaded, awaiting check':'No identity document on file'}${u.memberNo?'<br><b>Membership no.:</b> '+esc(u.memberNo):''}</p></div></div>${u.idDoc?`<p><b>Identity document</b></p><img src="${u.idDoc}" alt="Identity document" style="width:100%;border-radius:8px;border:1px solid var(--bd)">`:''}${r.body?`<p style="border-left:3px solid var(--au);padding-left:10px">${esc(r.body)}</p>`:''}<div class="row"><button class="btn" id="ra">Approve</button><button class="btn er" id="rr">Reject</button><button class="btn gh" onclick="closeM()">Close</button></div>`);
  $('#ra').onclick=()=>dec(r.id,'approved');$('#rr').onclick=()=>rej(r.id)});
}
function userReq(){const mine=S.requests.filter(r=>r.userId===ME.id);
 $('#main').innerHTML=`<div class="row"><h2 class="sp">My applications</h2><button class="btn" id="nw">New application</button></div>${mine.map(r=>`<div class="card"><div class="row"><b class="sp">${esc(r.title)}</b><span class="pill ${r.status==='approved'?'ok':r.status==='rejected'?'no':''}">${r.status}</span></div><p style="color:var(--mu)">${esc(r.date)}${r.reason?' · Reason: '+esc(r.reason):''}</p><button class="btn gh sm" data-l="${r.id}">Letter (PDF)</button></div>`).join('')||'<div class="card">No applications yet. Use New application or apply from Live Camps.</div>'}
 <div class="card"><h3>Scout ID card</h3><button class="btn au" id="ic">Generate my ID card</button></div>`;
 $('#ic').onclick=()=>idCard(ME);document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>letter(S.requests.find(x=>x.id===b.dataset.l)));
 $('#nw').onclick=()=>{modal(`<h3>New application</h3><form id="af"><label>Type</label><select name="k"><option value="application">General application</option><option value="troop">Troop registration</option></select><label>Subject</label><input name="t" required><label>Letter body</label><textarea name="b" rows="5" required></textarea><div style="margin-top:12px"><button class="btn">Send application</button></div></form>`);$('#af').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);S.requests.push({id:'r'+Date.now(),kind:f.get('k'),userId:ME.id,title:(f.get('k')==='troop'?'Troop registration: ':'')+f.get('t'),body:f.get('b'),status:'pending',date:new Date().toISOString().slice(0,10)});save();closeM();req()}}}

/* ---------- ID CARD & LETTER ---------- */
function idCard(u){
 modal(`<div class="idc" id="idc"><div class="h">${logo(46)}<b>District Boy Scout Association<br>Khairpur Mir's, Sindh</b></div><div class="b">${u.photo?`<img class="pic" src="${u.photo}" alt="Member photo">`:`<div class="pic" style="display:grid;place-items:center;font:800 28px Fraunces,serif;color:#064e3b">${esc(u.fullName.split(' ').map(w=>w[0]).slice(0,2).join(''))}</div>`}<div class="sp"><b style="font-size:15px">${esc(u.fullName)}</b><br>${ROLES[u.role]}<br>Group: ${esc(u.group)}<br>ID: ${esc(u.memberNo||'DBSA-KHP-'+u.id.slice(-5).toUpperCase())}<br>Emergency: ${esc(u.emName||'—')} ${esc(u.emPhone||'')}</div><div id="qr"></div></div></div>
 <div class="row" style="margin-top:14px"><button class="btn" onclick="window.print()">Print / save as PDF</button><button class="btn gh" onclick="closeM()">Close</button></div>`);
 try{new QRCode($('#qr'),{text:`DBSA-KHP|${u.id}|${u.fullName}|${u.role}|${u.status}`,width:70,height:70})}catch(e){$('#qr').textContent='QR unavailable'}}
function letter(r){const u=gu(r.userId);
 modal(`<div class="sheet" id="sheet"><div class="lh">${logo(64)}<div><b>DISTRICT BOY SCOUT ASSOCIATION</b>Khairpur Mir's, Sindh, Pakistan</div></div><p>Ref: DBSA/KHP/${esc(r.date.slice(0,4))}/${esc(r.id.slice(-5).toUpperCase())}<br>Date: ${esc(r.date)}</p><p>To,<br>The District Secretary,<br>District Boy Scout Association Khairpur Mir's</p><p><b>Subject: ${esc(r.title)}</b></p><p>Respected Sir,</p><p style="white-space:pre-wrap">${esc(r.body||'I respectfully submit this application for your kind consideration.')}</p><p>Yours obediently,</p><p style="margin-top:36px"><b>${esc(u.fullName)}</b><br>${ROLES[u.role]}, ${esc(u.group)}<br>Application status: ${esc(r.status)}</p><div style="display:flex;justify-content:space-between;gap:16px;margin-top:44px"><div style="border-top:1px solid #111;padding-top:4px;min-width:140px">Applicant signature</div><div style="border-top:1px solid #111;padding-top:4px;min-width:170px;text-align:center">District Secretary<br>District Boy Scout Association</div></div></div>
 <div class="row" style="margin-top:14px"><button class="btn" onclick="window.print()">Export PDF</button><button class="btn gh" onclick="closeM()">Close</button></div>`)}

/* ---------- BOOT ---------- */
(async()=>{
 const t=localStorage.getItem('dbsa_theme')||'dark';document.documentElement.dataset.theme=t;
 try{S=JSON.parse(localStorage.getItem('dbsa_v1'))}catch(e){}
 if(!S){S=await seed();save()}
 const id=sessionStorage.getItem('dbsa_sess');ME=id?S.users.find(u=>u.id===id&&u.status==='active'):null;
 ME?shell():loginView();
})();
</script>
